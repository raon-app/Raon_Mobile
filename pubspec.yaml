name: raon_mobile
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: ImcreSoojin
      fonts:
        - asset: assets/fonts/ImcreSoojin.ttf
          weight: 400
    - family: SuitVariable
      fonts:
        - asset: assets/fonts/ImcreSoojin.ttf
          weight: 400

  assets:
    - assets/images/